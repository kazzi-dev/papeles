# Render Blueprint for the Papeles API (free plan). See docs/DEPLOY.md.
services:
  - type: web
    name: papeles-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY # your Groq key; Render asks for it when you create the Blueprint
        sync: false
      - key: GEMINI_API_KEY # your Gemini key, used for search
        sync: false
      - key: CORS_ORIGINS # replace with your Vercel URL once you have it
        value: '["https://papeles.vercel.app"]'
      - key: CORS_ORIGIN_REGEX # also allows Vercel preview links
        value: https://papeles(-[a-z0-9-]+)?\.vercel\.app
