services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: papeles
      POSTGRES_PASSWORD: papeles
      POSTGRES_DB: papeles
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papeles"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        BAKE_DATA: "false"  # data goes into Postgres; run app.snapshot import after startup
    environment:
      DATABASE_URL: postgresql+psycopg://papeles:papeles@db:5432/papeles
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
