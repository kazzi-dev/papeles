services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: papeles
      POSTGRES_PASSWORD: papeles
      POSTGRES_DB: papeles
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papeles"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://papeles:papeles@db:5432/papeles
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      # Keep the downloaded embedding model between restarts.
      - models:/tmp/fastembed_cache
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  models:
