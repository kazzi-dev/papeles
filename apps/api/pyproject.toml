[project]
name = "papeles-api"
version = "0.1.0"
description = "RAG API that answers Philippine government paperwork questions from official sources"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only for EMBEDDING_PROVIDER=local (runs the embedding model on the server, ~600 MB of memory).
local = ["fastembed>=0.4"]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
